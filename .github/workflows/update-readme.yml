name: Update README
run-name: ${{ inputs.fallback_of && format('fallback:{0}', inputs.fallback_of) || 'Update README' }}

on:
  schedule:
    # Run every hour at minute 37 (UTC)
    - cron: "37 * * * *"
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      backend:
        type: choice
        options: [arc, hosted]
        default: arc
      source_sha:
        description: Exact source commit supplied by the router
        type: string
      fallback_of:
        description: Parent run ID supplied by the router
        type: string

jobs:
  update-readme:
    if: ${{ !inputs.source_sha || inputs.source_sha == github.workflow_sha }}
    runs-on: ${{ inputs.backend == 'hosted' && 'ubuntu-latest' || 'profile-linux' }}
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}

      - name: Verify source before writing repository content
        env:
          EXPECTED_SHA: ${{ inputs.source_sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Collect release download stats
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SF_SERVER_URL: ${{ secrets.SF_SERVER_URL }}
          SF_APP_API_KEY_TINCT: ${{ secrets.SF_APP_API_KEY_TINCT }}
        run: python scripts/collect_download_stats.py

      - name: Generate README
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/generate_readme.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md data/release_downloads/
          git diff --staged --quiet || (git commit -m "docs: update README with latest repo data" && git push)
concurrency:
  group: checks-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
